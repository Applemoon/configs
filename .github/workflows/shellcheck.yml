name: shellcheck

on:
  push:
    paths: ['**.sh', '.github/workflows/shellcheck.yml']
  pull_request:
    paths: ['**.sh']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          # shellcheck only supports sh/bash/ksh — exclude the zsh configs it can't parse
          ignore_names: .zshrc .p10k.zsh
        env:
          SHELLCHECK_OPTS: -e SC1090 -e SC1091   # ignore "can't follow sourced file"
